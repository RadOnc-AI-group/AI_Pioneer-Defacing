name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-lock.txt
      # TotalSegmentator is replaced by a stand-in in these tests; the other packages get the
      # versions of the lock file (the constraints file pins them without installing torch)
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt -c requirements-lock.txt
      - name: Run tests
        run: python -m pytest
